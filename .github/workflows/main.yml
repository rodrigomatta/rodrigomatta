name: update profile

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate-snake:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-svg:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Get Python 3.8
        uses: actions/setup-python@v6
        with:
          python-version: '3.8'
          cache: 'pip'
          cache-dependency-path: 'cache/requirements.txt'

      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt

      - name: Update SVG files
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN || github.token }}
          USER_NAME: ${{ secrets.USER_NAME || github.repository_owner }}
        run: python today.py

      - name: Commit
        run: |-
          git add dark_mode.svg light_mode.svg
          git diff --staged
          git config --global user.email "rodrigomatta@users.noreply.github.com"
          git config --global user.name "rodrigomatta/GitHub-Actions-Bot"
          git commit -m "Updated profile SVG cards" -a || echo "No changes to commit"
          git push
